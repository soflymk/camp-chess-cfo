{% extends 'base.html' %}
{% block title %}Cadastro – CFO Chess{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white text-center py-3">
        <h4 class="mb-0">♟ CFO Chess — Cadastro</h4>
      </div>
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('auth.register') }}" novalidate>
          <div class="mb-3">
            <label class="form-label">Nome </label>
            <input type="text" name="name" class="form-control" autofocus maxlength="120" />
          </div>
          <div class="mb-3">
            <label class="form-label">Username <span class="text-muted small">(para login)</span></label>
            <input type="text" name="username" class="form-control" required
                   pattern="[a-zA-Z0-9_]+" minlength="3" />
            <div class="form-text">Apenas letras, números e _. Mínimo 3 caracteres.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" name="password" class="form-control" required minlength="6" />
          </div>
          <div class="mb-3">
            <label class="form-label">Confirmar Senha</label>
            <input type="password" name="confirm" class="form-control" required />
          </div>
          <button type="submit" class="btn btn-dark w-100">Cadastrar</button>
        </form>
      </div>
      <div class="card-footer text-center text-muted py-3">
        Já tem conta? <a href="{{ url_for('auth.login') }}">Faça login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
