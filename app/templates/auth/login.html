{% extends 'base.html' %}
{% block title %}Login – CFO Chess{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:60vh">
  <div class="col-sm-10 col-md-6 col-lg-4">

    <div class="text-center mb-4">
      <div style="font-size:3.5rem;line-height:1">♟</div>
      <h1 class="fw-bold mt-2 mb-0" style="color:var(--navy)">CFO Chess</h1>
      <p class="text-muted small">Campeonatos de Xadrez</p>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h5 class="fw-bold mb-4 text-center" style="color:var(--navy)">Entrar na conta</h5>
        <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
          <div class="mb-3">
            <label class="form-label">Username</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" name="identifier" class="form-control" required autofocus
                     placeholder="Seu username" autocomplete="username" />
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Senha</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" class="form-control" required
                     placeholder="Sua senha" autocomplete="current-password" />
            </div>
          </div>
          <div class="mb-4 form-check">
            <input type="checkbox" class="form-check-input" name="remember" id="remember" />
            <label class="form-check-label small" for="remember">Lembrar de mim</label>
          </div>
          <button type="submit" class="btn btn-chess w-100">
            <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
          </button>
        </form>
      </div>
      <div class="card-footer text-center text-muted py-3 small">
        Não tem conta? <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-semibold">Cadastre-se</a>
      </div>
    </div>

  </div>
</div>
{% endblock %}
