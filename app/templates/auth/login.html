{% extends 'base.html' %}
{% block title %}Login – CFO Chess{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white text-center py-3">
        <h4 class="mb-0">♟ CFO Chess — Login</h4>
      </div>
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
          <div class="mb-3">
            <label class="form-label">Usuário ou Email</label>
            <input type="text" name="identifier" class="form-control" required autofocus />
          </div>
          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" name="password" class="form-control" required />
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" name="remember" id="remember" />
            <label class="form-check-label" for="remember">Lembrar de mim</label>
          </div>
          <button type="submit" class="btn btn-dark w-100">Entrar</button>
        </form>
      </div>
      <div class="card-footer text-center text-muted py-3">
        Não tem conta? <a href="{{ url_for('auth.register') }}">Cadastre-se</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
